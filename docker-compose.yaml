# Example: run the Diapason Uploader next to Navidrome, sharing the music volume.
#
#   docker compose up -d
#
# The uploader and Navidrome MUST mount the SAME music directory so files the
# uploader writes are seen by Navidrome's scanner.

services:
  navidrome:
    image: deluan/navidrome:latest
    restart: unless-stopped
    ports:
      - "4533:4533"
    environment:
      ND_SCANSCHEDULE: 1h
      ND_LOGLEVEL: info
    volumes:
      - ./data/navidrome:/data
      - ./music:/music:rw

  diapason-uploader:
    build: .
    # image: ghcr.io/nytuo/diapason-uploader:latest   # once published
    restart: unless-stopped
    # host networking is required for mDNS auto-discovery (DIAPASON_MDNS_ENABLED):
    # multicast doesn't traverse Docker's default bridge network, so devices on
    # your LAN won't see the advertisement unless the container shares the host's
    # network stack. Remove this and use `ports:` below instead if you don't need
    # auto-discovery (the app still works with the address/token entered manually).
    network_mode: host
    # ports:
    #   # Only used without network_mode: host. Bind to LAN only? map to
    #   # "127.0.0.1:8688:8688" and put a reverse proxy in front.
    #   - "8688:8688"
    environment:
      DIAPASON_MUSIC_DIR: /music
      DIAPASON_LISTEN_ADDR: 0.0.0.0:8688
      # Leave DIAPASON_AUTH_TOKEN unset to have one generated and persisted
      # automatically under DIAPASON_MUSIC_DIR on first run, or set your own:
      # DIAPASON_AUTH_TOKEN: "change-me-to-a-long-random-token"
      # Trigger a Navidrome rescan after uploads settle:
      DIAPASON_NAVIDROME_URL: http://navidrome:4533
      DIAPASON_NAVIDROME_USER: admin
      DIAPASON_NAVIDROME_PASSWORD: "your-navidrome-password"
      # For Plex instead, comment the three lines above and set:
      # DIAPASON_PLEX_URL: http://plex:32400
      # DIAPASON_PLEX_TOKEN: "xxxx"
      # DIAPASON_PLEX_SECTION: "1"
    volumes:
      - ./music:/music:rw
    depends_on:
      - navidrome
