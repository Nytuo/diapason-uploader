# Uploader next to Plex instead of Navidrome. After each upload settles the
# uploader asks Plex to refresh one library section.
#
# Find your section id:  http://<plex>:32400/library/sections?X-Plex-Token=<token>
# Token help: https://support.plex.tv/articles/204059436

services:
  plex:
    image: lscr.io/linuxserver/plex:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
      VERSION: docker
    volumes:
      - ./data/plex:/config
      - ./music:/music:rw

  diapason-uploader:
    image: ghcr.io/nytuo/diapason-uploader:latest
    restart: unless-stopped
    network_mode: host                  # lets mDNS discovery reach your LAN
    environment:
      DIAPASON_MUSIC_DIR: /music
      DIAPASON_PLAIN_HTTP_OK: "true"
      DIAPASON_PLEX_URL: http://localhost:32400
      DIAPASON_PLEX_TOKEN: "your-plex-token"
      DIAPASON_PLEX_SECTION: "1"
      # DIAPASON_YTDLP_ENABLED: "true"
    volumes:
      - ./music:/music:rw
    depends_on:
      - plex
